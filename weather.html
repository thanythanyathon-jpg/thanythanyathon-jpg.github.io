<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<style>
:root{--bg:#17153b;--panel:#16143a;--ink:#f1f0ff;--muted:#a9a7cf;--line:rgba(255,255,255,.1);--accent:#6d5ce8;--on:#fff;--err:#ff9d9d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
a{color:var(--accent)}h1{margin:8px 0 20px;font-size:28px}h2{font-size:18px;margin:0 0 12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
form{display:flex;gap:10px;flex-wrap:wrap}
input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%}
#sugg{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;max-height:min(280px,50vh);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
#sugg li{padding:10px;border-radius:7px;cursor:pointer}
#sugg li.on,#sugg li:hover{background:var(--accent);color:var(--on)}
#sugg li.hint,#sugg li.hint:hover{color:var(--muted);background:none;cursor:default}
@media (max-width:560px){.search{flex-basis:100%}}
button{cursor:pointer}button.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
#status{min-height:1.6em;margin:0 0 12px;color:var(--muted)}#status.err{color:var(--err)}
/* ---- Hero: current weather (indigo dashboard style) ---- */
.hero{--h-ink:#F1F0FF;--h-mut:#A9A7CF;--h-a:#A99CFF;position:relative;overflow:hidden;margin-bottom:16px;padding:28px;color:var(--h-ink);border:1px solid rgba(255,255,255,.08);border-radius:24px;
background:radial-gradient(90% 80% at 0 0,rgba(124,108,242,.28),transparent 60%),linear-gradient(145deg,#1c1a4b,#13112f);
-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 48px rgba(6,4,28,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s ease,border-color .3s ease}
@media (hover:hover){.hero:hover{transform:translateY(-2px);border-color:rgba(169,156,255,.3)}}
.hero-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center}
.hero-art{position:relative;width:112px;height:112px;margin-bottom:6px}
.hero-art::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,rgba(124,108,242,.5),transparent 70%);filter:blur(14px)}
.hero-art svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.h-temp{margin:0;font-size:clamp(64px,10vw,80px);font-weight:700;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.h-temp small{font-size:.6em;font-weight:600}
.h-place{margin:6px 0 0;font-size:22px;font-weight:600;overflow-wrap:anywhere}
.h-place span+span{color:var(--h-mut);font-weight:400}
#hRegion:not(:empty)::before{content:", "}
.h-cond{margin:2px 0 0;font-size:17px;font-weight:500;color:var(--h-a)}
.h-feel{margin:8px 0 0;color:var(--h-mut)}.h-feel strong{color:var(--h-ink)}
.h-meta{margin:16px 0 0;padding:16px 0 0;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:8px;color:var(--h-mut)}
.h-meta div{display:flex;align-items:center;gap:10px}
.h-meta svg,.hero-facts svg{flex:none;width:20px;height:20px;color:var(--h-a)}
.hero-facts{margin:0;padding:6px 20px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.hero-facts>div{display:flex;align-items:center;gap:12px;padding:16px 0;min-width:0}
.hero-facts>div+div{border-top:1px solid rgba(255,255,255,.08)}
.hero-facts dt{color:var(--h-mut);flex:1}
.hero-facts dd{margin:0;font-size:20px;font-weight:600;text-align:right}
.hero.swap .hero-main{animation:heroIn .5s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(6px)}}
@media (max-width:720px){.hero{padding:22px 18px}.hero-main{grid-template-columns:minmax(0,1fr);gap:20px}}
@media (prefers-reduced-motion:reduce){.hero,.hero-art svg,.hero.swap .hero-main{animation:none;transition:none}.hero:hover{transform:none}}
/* ---- Indigo theme for the rest of the page ---- */
body{background:radial-gradient(90% 50% at 20% 0,#2b2768,transparent 60%),linear-gradient(180deg,#1d1a4a,#110f2e) fixed;min-height:100vh}
a{color:#a99cff}
.box{background:rgba(22,20,58,.85);border-color:rgba(255,255,255,.06);border-radius:20px}
input{border-radius:999px;padding:10px 16px;background:rgba(255,255,255,.06);border-color:#7c6cf2;box-shadow:0 0 0 3px rgba(124,108,242,.18)}
button{border-radius:999px;padding:8px 16px;background:rgba(255,255,255,.06)}
.day{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.06);border-radius:16px}
/* ---- 7-day forecast ---- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:176px;padding:16px 8px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.day>strong{font-size:16px}
.day .i{width:44px;height:44px}.day .i svg{display:block;width:100%;height:100%}
.day .t{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 8px}
.day .t strong{font-size:18px;font-weight:600}.day .t span{font-size:15px;color:var(--muted)}
.day small{font-size:14px;color:#9fb4ff}
@media (hover:hover){.day:hover{transform:translateY(-4px);border-color:#a99cff;box-shadow:0 10px 24px rgba(6,4,28,.4)}}
@media (max-width:1023px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:767px){.days{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(124px,38%);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px}.day{scroll-snap-align:start}}
@media (prefers-reduced-motion:reduce){.day{transition:none}.day:hover{transform:none}}
footer{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html">← Back to portfolio</a>
  <h1>Weather App</h1>

  <section class="box">
    <form id="form" autocomplete="off">
      <div class="search" id="searchWrap">
        <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" aria-label="City name" placeholder="Search a city, e.g. Chiang Mai" maxlength="60" autocomplete="off" enterkeyhint="search" required>
        <ul id="sugg" role="listbox" aria-label="City suggestions" hidden></ul>
      </div>
      <button class="p" type="submit">Search</button>
      <button id="unit" type="button" aria-pressed="false" aria-label="Show temperature in Fahrenheit">°F</button>
    </form>
  </section>

  <p id="status" role="status"></p>
  <div id="out" hidden>
    <section class="hero" id="now" aria-label="Current weather">
      <div class="hero-main">
        <div class="hero-info">
          <div class="hero-art" id="hArt" aria-hidden="true"></div>
          <div class="h-temp"><span id="hNum">--</span>° <small id="hUnit">C</small></div>
          <p class="h-place"><span id="hCity"></span><span id="hRegion"></span></p>
          <p class="h-cond" id="hCond"></p>
          <p class="h-feel">Feels like <strong id="hFeel"></strong></p>
          <div class="h-meta">
            <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="hDate"></span></div>
            <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="hTime"></span></div>
          </div>
        </div>
        <dl class="hero-facts">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z"/></svg><dt>Feels like</dt><dd id="fFeel"></dd></div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.4 6 10.5a6 6 0 0 1-12 0C6 9.4 12 3 12 3Z"/></svg><dt>Humidity</dt><dd id="fHum"></dd></div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9a2.5 2.5 0 1 0-2.5-2.5M3 12h14a3 3 0 1 1-3 3M3 16h7"/></svg><dt>Wind</dt><dd id="fWind"></dd></div>
        </dl>
      </div>
    </section>
    <section class="box"><h2>7-day forecast</h2><div class="days" id="days"></div></section>
  </div>
  <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0).</footer>
</div>

<script>
const GEO = "https://geocoding-api.open-meteo.com/v1/search";
const FORECAST = "https://api.open-meteo.com/v1/forecast";
const KEY = "weather-app.v1";
const WMO = { 0: ["Clear sky", "☀️", "🌙"], 1: ["Mainly clear", "🌤️", "🌙"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Rime fog", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy drizzle", "🌧️"],
  56: ["Freezing drizzle", "🌧️"], 57: ["Freezing drizzle", "🌧️"], 61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  66: ["Freezing rain", "🌧️"], 67: ["Freezing rain", "🌧️"], 71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "❄️"],
  77: ["Snow grains", "🌨️"], 80: ["Light showers", "🌦️"], 81: ["Showers", "🌧️"], 82: ["Violent showers", "⛈️"],
  85: ["Snow showers", "🌨️"], 86: ["Heavy snow showers", "❄️"], 95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm with hail", "⛈️"], 99: ["Thunderstorm with hail", "⛈️"] };

const $ = id => document.getElementById(id);
const el = (t, p = {}, k = []) => { const n = Object.assign(document.createElement(t), p); [].concat(k).forEach(x => n.append(x)); return n; };
const info = (code, isDay = 1) => { const w = WMO[code] || ["Unknown", "🌡️"]; return { text: w[0], icon: !isDay && w[2] ? w[2] : w[1] }; };

let place = { name: "Bangkok, Thailand", lat: 13.7563, lon: 100.5018 };
let unit = "C", data = null, req = 0;
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) { if (s.place && Number.isFinite(s.place.lat) && Number.isFinite(s.place.lon)) place = s.place; if (s.unit === "F") unit = "F"; } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ place, unit })); } catch (e) {} };

const temp = c => Math.round(unit === "F" ? c * 9 / 5 + 32 : c) + "°";
const wind = k => unit === "F" ? Math.round(k * 0.621) + " mph" : Math.round(k) + " km/h";
function status(text, isErr) { $("status").textContent = text; $("status").className = isErr ? "err" : ""; }
async function getJSON(url, signal) {          // 10 s timeout; optional outside abort signal
  const c = new AbortController(), t = setTimeout(() => c.abort(), 10000);
  if (signal) signal.addEventListener("abort", () => c.abort());
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

/* ---------- Hero helpers: SVG weather icons, date, number tween ---------- */
const DEFS = '<defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>' +
  '<linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient>' +
  '<linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="0" y1="-26" x2="0" y2="18"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#B6C4DC"/></linearGradient>' +
  '<linearGradient id="gd" gradientUnits="userSpaceOnUse" x1="0" y1="-26" x2="0" y2="18"><stop offset="0" stop-color="#A9B6CC"/><stop offset="1" stop-color="#64748B"/></linearGradient></defs>';
const g = (x, y, s, body) => '<g transform="translate(' + x + " " + y + ") scale(" + s + ')">' + body + "</g>";
const SUN = (() => { let r = ""; for (let a = 0; a < 8; a++) { const t = a * Math.PI / 4, c = Math.cos(t), n = Math.sin(t);
  r += '<line x1="' + (c * 28).toFixed(1) + '" y1="' + (n * 28).toFixed(1) + '" x2="' + (c * 36).toFixed(1) + '" y2="' + (n * 36).toFixed(1) + '"/>'; }
  return '<g stroke="url(#gs)" stroke-width="5" stroke-linecap="round">' + r + '</g><circle r="19" fill="url(#gs)"/>'; })();
const MOON = '<path d="M12-27.5A30 30 0 1 0 27.5 12A24 24 0 0 1 12-27.5Z" fill="url(#gm)"/>';
const CLOUD = dark => '<g fill="url(#' + (dark ? "gd" : "gc") + ')"><circle cx="-14" cy="4" r="14"/><circle cx="6" cy="-6" r="20"/><circle cx="24" cy="6" r="14"/><rect x="-14" y="4" width="38" height="14"/></g>';
const LIGHT_RAIN = [51, 53, 56, 57, 61, 80];
function heroIcon(code, isDay) {
  const sky = isDay ? SUN : MOON; let b;
  if (code === 0) b = g(60, 60, 1.35, sky);
  else if (code <= 2) b = g(42, 44, 1.05, sky) + g(72, 72, 1.1, CLOUD());
  else if (code === 3) b = g(54, 60, 1.5, CLOUD());
  else if (code === 45 || code === 48) b = g(52, 36, 1.3, CLOUD()) + '<g stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"><path d="M24 72h72M36 84h68M28 96h56"/></g>';
  else if (code >= 95) b = g(52, 40, 1.3, CLOUD(true)) + '<polygon points="58,68 42,92 56,92 48,112 76,82 62,82 70,68" fill="url(#gs)"/>';
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) b = g(52, 40, 1.3, CLOUD()) + '<g fill="#E0F2FE"><circle cx="40" cy="84" r="4.5"/><circle cx="60" cy="94" r="4.5"/><circle cx="80" cy="84" r="4.5"/><circle cx="50" cy="106" r="4.5"/><circle cx="72" cy="108" r="4.5"/></g>';
  else { const xs = LIGHT_RAIN.includes(code) ? [40, 60, 80] : [34, 52, 70, 88];
    b = g(52, 40, 1.3, CLOUD(true)) + '<g stroke="#60A5FA" stroke-width="4.5" stroke-linecap="round">' + xs.map(x => '<line x1="' + x + '" y1="78" x2="' + (x - 5) + '" y2="98"/>').join("") + "</g>"; }
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' + DEFS + b + "</svg>";
}
const heroDate = () => { const o = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
  try { return new Date().toLocaleDateString("en-US", Object.assign({ timeZone: data.timezone }, o)); } catch (e) { return new Date().toLocaleDateString("en-US", o); } };
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const tnum = c => Math.round(unit === "F" ? c * 9 / 5 + 32 : c);
let shown = null, raf = 0;
function tween(node, to) {                      // smooth number change; always ends on the exact value
  cancelAnimationFrame(raf);
  const from = shown; shown = to;
  if (from === null || from === to || reduceMotion.matches) { node.textContent = to; return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 450);
    node.textContent = k < 1 ? Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))) : to;
    if (k < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}

const tickClock = () => { if (!data) return; const o = { hour12: false };
  try { $("hTime").textContent = new Date().toLocaleTimeString("en-GB", Object.assign({ timeZone: data.timezone }, o)); }
  catch (e) { $("hTime").textContent = new Date().toLocaleTimeString("en-GB", o); } };
setInterval(tickClock, 1000);
function render(fresh) {
  if (!data) return;
  const c = data.current, d = data.daily, i = info(c.weather_code, c.is_day);
  const parts = place.name.split(", "), hero = $("now");
  $("hCity").textContent = parts[0]; $("hRegion").textContent = parts.slice(1).join(", ");
  $("hDate").textContent = heroDate();
  tween($("hNum"), tnum(c.temperature_2m));
  $("hCond").textContent = i.text; $("hUnit").textContent = unit; tickClock();
  $("hFeel").textContent = $("fFeel").textContent = temp(c.apparent_temperature);
  $("fHum").textContent = Math.round(c.relative_humidity_2m) + "%";
  $("fWind").textContent = wind(c.wind_speed_10m);
  $("hArt").innerHTML = heroIcon(c.weather_code, c.is_day);
  if (fresh) { hero.classList.remove("swap"); void hero.offsetWidth; hero.classList.add("swap"); }
  $("days").replaceChildren(...d.time.map((t, n) => {
    const [y, m, dd] = t.split("-").map(Number), di = info(d.weather_code[n]);
    const name = n === 0 ? "Today" : new Date(y, m - 1, dd).toLocaleDateString("en-US", { weekday: "short" });
    const rain = d.precipitation_probability_max && d.precipitation_probability_max[n] != null ? d.precipitation_probability_max[n] + "% rain" : "";
    return el("div", { className: "day", title: di.text }, [el("strong", { textContent: name }),
      Object.assign(el("div", { className: "i" }), { innerHTML: heroIcon(d.weather_code[n], 1) }),
      el("div", { className: "t" }, [el("strong", { textContent: temp(d.temperature_2m_max[n]) }), el("span", { textContent: temp(d.temperature_2m_min[n]) })]),
      el("small", { textContent: rain })]);
  }));
  $("out").hidden = false;
}

async function loadWeather() {
  const my = ++req;
  status("Loading weather…");
  try {
    const url = FORECAST + "?latitude=" + place.lat + "&longitude=" + place.lon +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7";
    const json = await getJSON(url);
    if (my !== req) return;                 // a newer request replaced this one
    if (!json.current || !json.daily) throw new Error("Unexpected response");
    data = json; render(true); status("");
  } catch (e) {
    if (my !== req) return;
    status("Could not load the weather. Check your connection and try again.", true);
  }
}

/* ---------- City search with live suggestions ---------- */
let items = [], active = -1, qid = 0, timer = null, ctrl = null;
const q = $("q"), sugg = $("sugg");

function toPlace(r) {
  return { name: [r.name, r.admin1, r.country].filter((x, i, a) => x && a.indexOf(x) === i).join(", "), lat: r.latitude, lon: r.longitude };
}
async function fetchPlaces(text, signal) {
  const json = await getJSON(GEO + "?name=" + encodeURIComponent(text) + "&count=8&language=en&format=json", signal);
  const seen = new Set(), out = [];
  for (const r of json.results || []) {
    if (!Number.isFinite(r.latitude) || !Number.isFinite(r.longitude)) continue;
    const p = toPlace(r);
    if (seen.has(p.name) && r.admin2) p.name += " (" + r.admin2 + ")";   // same label, different place
    if (seen.has(p.name)) continue;                                       // true duplicate
    seen.add(p.name); out.push(p);
  }
  return out;
}

function closeSugg() { sugg.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); active = -1; }
function setActive(n) {
  active = n;
  [...sugg.children].forEach((li, i) => { li.setAttribute("aria-selected", i === n); li.classList.toggle("on", i === n); if (i === n && li.scrollIntoView) li.scrollIntoView({ block: "nearest" }); });
  if (n >= 0) q.setAttribute("aria-activedescendant", "opt-" + n); else q.removeAttribute("aria-activedescendant");
}
function openSugg() { sugg.hidden = false; q.setAttribute("aria-expanded", "true"); }
function showHint(text) { items = []; active = -1; sugg.replaceChildren(el("li", { className: "hint", textContent: text })); q.removeAttribute("aria-activedescendant"); openSugg(); }
function showSugg(list, text) {
  if (!list.length) return showHint("No matching cities");
  items = list; active = -1;
  sugg.replaceChildren(...list.map((p, i) => {
    const li = el("li", { id: "opt-" + i }), low = p.name.toLowerCase(), t = text.toLowerCase();
    li.setAttribute("role", "option"); li.setAttribute("aria-selected", "false");
    if (t && low.startsWith(t)) li.append(el("strong", { textContent: p.name.slice(0, t.length) }), p.name.slice(t.length)); else li.append(p.name);
    li.onmousedown = e => e.preventDefault();          // keep focus in the input
    li.onclick = () => choose(p);
    return li;
  }));
  openSugg();
}

function choose(p) {
  place = p; save(); items = []; ++qid; clearTimeout(timer); if (ctrl) ctrl.abort();
  closeSugg(); q.value = p.name; loadWeather();
}

async function suggest(text) {
  const my = ++qid; ctrl = new AbortController();
  try { const list = await fetchPlaces(text, ctrl.signal); if (my === qid) showSugg(list, text); }
  catch (e) { if (my === qid) showHint("Could not load suggestions. Check your connection."); }
}

q.addEventListener("input", () => {
  clearTimeout(timer); ++qid; if (ctrl) ctrl.abort();      // invalidate any request still in flight
  const text = q.value.trim();
  if (text.length < 2) { items = []; closeSugg(); return; }
  timer = setTimeout(() => suggest(text), 250);            // debounce
});
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && items.length) { e.preventDefault(); if (sugg.hidden) { showSugg(items, q.value.trim()); } setActive((active + 1) % items.length); }
  else if (e.key === "ArrowUp" && items.length) { e.preventDefault(); if (sugg.hidden) showSugg(items, q.value.trim()); setActive(active <= 0 ? items.length - 1 : active - 1); }
  else if (e.key === "Escape" && !sugg.hidden) { e.preventDefault(); closeSugg(); }
  else if (e.key === "Enter" && !sugg.hidden && active >= 0) { e.preventDefault(); choose(items[active]); }
});
q.addEventListener("focus", () => { if (items.length && sugg.hidden && q.value.trim().length >= 2) showSugg(items, q.value.trim()); });
document.addEventListener("click", e => { if (!$("searchWrap").contains(e.target)) closeSugg(); });

$("form").onsubmit = async e => {                            // Enter with nothing highlighted, or the Search button
  e.preventDefault();
  const text = q.value.trim();
  if (text.length < 2) return status("Type at least 2 letters of a city name.", true);
  clearTimeout(timer); if (ctrl) ctrl.abort(); const my = ++qid;
  status("Searching…");
  try {
    const list = await fetchPlaces(text);
    if (my !== qid) return;
    if (!list.length) { closeSugg(); return status("No place found for “" + text + "”. Try another spelling.", true); }
    choose(list[0]);
  } catch (err) { if (my === qid) status("Search failed. Check your connection and try again.", true); }
};

$("unit").onclick = () => {
  unit = unit === "C" ? "F" : "C"; save();
  $("unit").textContent = unit === "C" ? "°F" : "°C";
  $("unit").setAttribute("aria-pressed", unit === "F");
  $("unit").setAttribute("aria-label", unit === "C" ? "Show temperature in Fahrenheit" : "Show temperature in Celsius");
  render();
};

if (unit === "F") { $("unit").textContent = "°C"; $("unit").setAttribute("aria-pressed", "true"); }
loadWeather();
</script>
</body>
</html>
