<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanyathon Kitsakun – Resume & Portfolio</title>
<meta name="description" content="Resume and portfolio of Thanyathon Kitsakun">
<meta name="theme-color" content="#2c4fd8">
<meta property="og:type" content="website">
<meta property="og:title" content="Thanyathon Kitsakun – Resume & Portfolio">
<meta property="og:description" content="Student & aspiring web developer. Projects, skills and CV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c4fd8'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' font-family='Arial' font-weight='700' fill='%23ffffff'%3ETK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f7; --panel:#ffffff; --ink:#16233b; --muted:#5b6880; --line:#d8dfe8;
  --accent:#2c4fd8; --accent-ink:#ffffff; --tag:#e4eafb;
  --shadow:0 1px 2px rgba(19,32,58,.05),0 12px 32px -14px rgba(19,32,58,.2);
  --display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1624;--panel:#17213a;--ink:#e8edf7;--muted:#9aa8c4;--line:#2a3756;--accent:#8aa2ff;--accent-ink:#0f1624;--tag:#22305a;
        --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.65)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 16px/1.7 var(--body);-webkit-font-smoothing:antialiased;background:var(--bg);
  background:radial-gradient(900px 440px at 90% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 380px at -6% 14%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{left:12px}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 56px;display:grid;grid-template-columns:304px minmax(0,1fr);gap:48px}
aside{position:sticky;top:24px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow)}

/* profile card */
.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:700 36px var(--display);color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#6a3de0));box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font:700 28px/1.15 var(--display);letter-spacing:-.02em;margin:20px 0 4px}
.role{color:var(--muted);margin:0 0 14px}
.status{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500;background:var(--tag);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.status .dot{width:8px;height:8px;border-radius:50%;background:#22a56b;animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,165,107,.5)}70%,100%{box-shadow:0 0 0 8px rgba(34,165,107,0)}}
.contact{list-style:none;margin:0 0 22px;padding:16px 0 0;border-top:1px solid var(--line);display:grid;gap:2px;font-size:15px}
.contact a{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;padding:7px 8px;margin:0 -8px;border-radius:8px;overflow-wrap:anywhere;transition:background .15s}
.contact a:hover{background:var(--tag)}
.contact .ic{display:inline-flex;color:var(--accent)}
.contact svg{width:18px;height:18px;flex:none}
nav{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 14px var(--body);padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--accent)}

/* sections */
section{margin-bottom:56px}
h2{display:flex;align-items:center;gap:12px;font:700 24px var(--display);letter-spacing:-.01em;margin:0 0 18px}
h2::before{content:"";width:24px;height:4px;border-radius:2px;background:var(--accent)}
.lead{font-size:18px;line-height:1.8;max-width:64ch;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 20px;min-width:130px}
.stat b{display:block;font:700 30px/1.1 var(--display)}
.stat span{font-size:13px;color:var(--muted)}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px 22px 20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card::before{content:"";position:absolute;left:22px;top:0;width:44px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 70%,var(--line));box-shadow:var(--shadow)}
.pico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--tag);color:var(--accent);font:700 15px var(--display)}
.pico svg{width:22px;height:22px}
.card h3{margin:2px 0 0;font:600 18px/1.3 var(--display)}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.stack{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stack-label{width:100%;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--tag);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;transition:background .15s,color .15s}
.tag.sm{font-size:12px;padding:2px 10px;background:transparent;border:1px solid var(--line)}
.links{display:flex;gap:16px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.links a{font-size:14px;font-weight:600;text-decoration:none}
.links a::after{content:" \2192"}
.links a:hover{text-decoration:underline;text-underline-offset:3px}

/* skills + education */
/* skills */
[hidden]{display:none!important}
.sk-wrap{container-type:inline-size}
.sk-grid{display:grid;grid-template-columns:1fr;gap:14px}
@container (min-width:520px){.sk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:760px){.sk-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.sk-card{grid-column:span 2}.sk-card[data-size="wide"]{grid-column:span 3}.sk-card[data-size="full"]{grid-column:span 6}}
.sk-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;transition:transform .2s,box-shadow .2s,border-color .2s}
.sk-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));border-top-color:var(--accent)}
.sk-head{display:flex;align-items:center;gap:12px}
.sk-head h3{margin:0;font:600 16px/1.25 var(--display)}
.sk-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--tag);color:var(--accent)}
.sk-ico svg{width:20px;height:20px}
.sk-note{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.sk-chips{display:flex;flex-wrap:wrap;gap:8px}
.sk{display:inline-flex;align-items:center;gap:6px;padding:7px 17px;border-radius:999px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:15px;font-weight:600;cursor:default;transition:transform .15s,background .15s,color .15s,box-shadow .15s}
.sk small{font-size:12px;font-weight:500;opacity:.85}
.sk:hover{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--accent) 90%,transparent)}
/* proficiency bars: only for skills where the owner set a level */
.sk-levels{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sk-level{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;margin:0 -10px;border-radius:8px;transition:background .15s}
.sk-level:hover{background:var(--tag)}
.sk-level b{font-weight:600;font-size:14.5px}
.sk-level small{font-size:12px;color:var(--muted)}
.meter{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.meter i{height:6px;border-radius:3px;background:var(--line);transition:background .2s}
.meter i.on{background:var(--accent)}
.sk-level:hover .meter i.on{filter:brightness(1.15)}
.sk-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:14px 0 0;font-size:12.5px;color:var(--muted)}
.sk-legend .lg{display:inline-flex;align-items:center;gap:8px}
.sk-legend .meter{grid-column:auto;width:36px}
/* currently learning: visually separate from the skills above */
.learn{margin-top:26px;padding:18px 20px;border:1.5px dashed color-mix(in srgb,var(--accent) 70%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--tag) 55%,transparent)}
.learn h3{display:flex;align-items:center;gap:10px;margin:0 0 2px;font:600 16px var(--display)}
.learn h3 svg{width:20px;height:20px;color:var(--accent)}
.learn>p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.learn ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.learn li{display:flex;flex-direction:column;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);transition:transform .15s,border-color .15s}
.learn li:hover{transform:translateY(-2px);border-color:var(--accent)}
.learn li b{font-size:14px}
.learn li span{font-size:12.5px;color:var(--muted)}
.edu{margin:0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:16px 20px}
footer{text-align:center;color:var(--muted);font-size:13px}

/* motion + responsive + print */
@media (prefers-reduced-motion:no-preference){.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}.reveal.in{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.status .dot{animation:none}.card,.btn{transition:none}}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:28px;padding:20px 16px 40px}aside{position:static;padding:22px}h2{font-size:22px}section{margin-bottom:44px}}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .wrap{display:block;padding:0}aside{position:static;border:0;box-shadow:none;padding:0;margin-bottom:16px}
  nav,.filters,footer,.links,.status,.stats,.skip,.card::before{display:none}
  .reveal{opacity:1!important;transform:none!important}
  .card{break-inside:avoid}.grid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){.sk,.sk-card,.learn li,.sk-level,.meter i{transition:none}.sk:hover,.sk-card:hover,.learn li:hover{transform:none}}
@media print{.sk-card,.learn,.sk-card{box-shadow:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <aside>
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="role" id="title"></p>
    <p class="status" id="status" hidden><span class="dot"></span><span id="statusText"></span></p>
    <ul class="contact" id="contact"></ul>
    <nav>
      <a class="btn primary" href="#projects">View projects</a>
      <a class="btn" id="cvBtn" href="#" target="_blank" rel="noopener" hidden>View CV (PDF)</a>
    </nav>
  </aside>

  <main id="main">
    <section id="about"><h2>About</h2><p class="lead" id="summary"></p><div class="stats" id="stats"></div></section>
    <section id="projects">
      <h2>Projects</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter projects by category"></div>
      <div class="grid" id="projectGrid"></div>
    </section>
    <section id="skills">
      <h2>Skills</h2>
      <div class="sk-wrap"><div class="sk-grid" id="skillList"></div></div>
      <p class="sk-legend" id="skillLegend" hidden></p>
      <div class="learn" id="learning" hidden></div>
    </section>
    <section id="education"><h2>Education</h2><div id="eduList"></div></section>
    <footer>Last updated: <span id="updated"></span></footer>
  </main>
</div>

<script>
/* ============================================================
   Edit your information here (nothing else needs to change)
   ============================================================ */
const DATA = {
  name: "Thanyathon Kitsakun",
  title: "Student & Aspiring Web Developer",
  photo: "",            // e.g. "images/me.jpg", or leave empty to show your initial
  updated: "October 2026",
  status: "Open to internships",
  cv: "CV.pdf",         // file name of your CV in the same folder (names are case-sensitive on GitHub)
  contact: [
    { label: "thanythanyathon@gmail.com", href: "mailto:thanythanyathon@gmail.com" },
    { label: "My GitHub", href: "https://github.com/thanythanyathon-jpg" },
    { label: "My Linkin", href: "https://www.linkedin.com/in/thanyathon-kitsakun-724b40446/" }
  ],
  summary: "Student who enjoys building small, practical web tools. Currently looking for internships and projects where I can learn and contribute.",
  projects: [
    { icon: "wallet", name: "Expense Tracker", stack: ["HTML", "CSS", "JavaScript", "Supabase", "PostgreSQL", "Auth"], desc: "Log income and spending, see monthly totals and a category breakdown. Works instantly in your browser.", tags: ["Web app"], links: [{ label: "Open app", href: "expense.html" }] },
    { icon: "calendar", name: "Meeting Room Booking", stack: ["HTML", "CSS", "JavaScript", "Supabase", "PostgreSQL", "Auth", "Realtime"], desc: "Pick a room, date and time on a daily availability grid. Double bookings are blocked automatically.", tags: ["Web app"], links: [{ label: "Open app", href: "booking.html" }] },
    { icon: "cloud", name: "Weather App", stack: ["HTML", "CSS", "JavaScript", "Open-Meteo API"], desc: "Search any city with live suggestions for current conditions and a 7-day forecast, powered by the free Open-Meteo API.", tags: ["Web app", "API"], links: [{ label: "Open app", href: "weather.html" }] }
  ],
  /* Skills. kind: "tech" | "soft" | "lang". size = width on large screens ("wide" or "full"). All categories share one style.
     LEVELS (optional, per skill): write { name: "Python", level: "Intermediate" } using Beginner, Intermediate or Advanced.
     A skill shows a level bar ONLY when you set a level; plain strings are shown as simple tags. */
  skills: [
    { group: "Programming Languages", icon: "code", kind: "tech", size: "wide", items: ["JavaScript", "Python", "Java"] },
    { group: "Web Development", icon: "web", kind: "tech", size: "wide", items: ["HTML", "CSS"] },
    { group: "Frameworks & Libraries", icon: "layers", kind: "tech", items: ["React", "TypeScript", "Vite", "Tailwind CSS", "Recharts"] },
    { group: "Database", icon: "db", kind: "tech", items: ["SQL", "MySQL", "PostgreSQL", "ER Modelling", "Supabase"] },
    { group: "Development Tools", icon: "tools", kind: "tech", items: ["Git", "GitHub", "Visual Studio Code", "Figma"] },
    { group: "Software Testing", icon: "shield", kind: "tech", size: "wide",
      note: "Concepts learned through coursework and practical exercises.", items: ["Software Testing Fundamentals"] },
    { group: "Soft Skills", icon: "users", kind: "soft", size: "wide", items: ["Problem-Solving", "Analytical Thinking", "Teamwork and Collaboration", "Adaptability"] },
    { group: "Spoken Languages", icon: "chat", kind: "lang", size: "full", items: [{ name: "Thai", note: "Native" }, { name: "English", note: "Intermediate" }] }
  ],
  /* Currently learning (kept separate from the skills above). Add items to show the section, e.g. { name: "Docker", note: "optional note" } */
  learning: [],
  education: [
    { school: "Mahidol University", degree: "Bachelor's degree in Information & Computer Technology Major (in progress)", period: "2025 – 2029" }
  ]
};

/* ---------------- Rendering (no need to edit) ---------------- */
const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  [].concat(kids).forEach(k => n.append(k));
  return n;
};

document.title = DATA.name + " – Resume & Portfolio";
$("name").textContent = DATA.name;
$("title").textContent = DATA.title;
$("summary").textContent = DATA.summary;
$("updated").textContent = DATA.updated;

if (DATA.photo) $("avatar").append(el("img", { src: DATA.photo, alt: DATA.name }));
else $("avatar").textContent = DATA.name.trim().charAt(0);

const ICONS = {
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.34.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3V9.75zm6.5 0h3.83v1.54h.05c.53-1 1.84-2.04 3.78-2.04 4.04 0 4.79 2.66 4.79 6.12V21h-4v-4.9c0-1.17-.02-2.67-1.63-2.67-1.63 0-1.88 1.27-1.88 2.58V21h-4V9.75z"/></svg>'
};
DATA.contact.forEach(c => {
  const h = c.href || "";
  const icon = /^mailto:/.test(h) ? ICONS.mail : /github\.com/.test(h) ? ICONS.github : /linkedin\.com/.test(h) ? ICONS.linkedin : "";
  const label = el("span", { textContent: c.label });
  $("contact").append(el("li", {}, h
    ? el("a", { href: h, target: h.startsWith("http") ? "_blank" : "", rel: "noopener" }, [el("span", { className: "ic", innerHTML: icon }), label])
    : label));
});

const PICONS = {
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5H7z"/></svg>'
};

/* Projects + category filter */
const allTags = ["All", ...new Set(DATA.projects.flatMap(p => p.tags))];
let current = "All";
function renderProjects() {
  $("projectGrid").replaceChildren(...DATA.projects
    .filter(p => current === "All" || p.tags.includes(current))
    .map((p, i) => el("article", { className: "card" }, [
      el("div", { className: "pico", innerHTML: PICONS[p.icon] || String(i + 1).padStart(2, "0"), ariaHidden: "true" }),
      el("h3", { textContent: p.name }),
      el("p", { textContent: p.desc }),
      ...(p.stack ? [el("div", { className: "stack" }, [el("span", { className: "stack-label", textContent: "Built with" }), ...p.stack.map(t => el("span", { className: "tag sm", textContent: t }))])] : []),
      el("div", { className: "tags" }, p.tags.map(t => el("span", { className: "tag", textContent: t }))),
      el("div", { className: "links" }, p.links.map(l => el("a", { href: l.href, textContent: l.label, target: /^https?:/.test(l.href) ? "_blank" : "", rel: "noopener" })))
    ])));
  [...$("filters").children].forEach(b => b.setAttribute("aria-pressed", b.textContent === current));
}
allTags.forEach(t => $("filters").append(el("button", { className: "btn", type: "button", textContent: t, onclick: () => { current = t; renderProjects(); } })));
renderProjects();
if (allTags.length < 3) $("filters").style.display = "none";   // hide the filter only when there is nothing to filter

/* Skills */
const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const SKILL_ICONS = {
  code: svg('<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>'),
  web: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'),
  layers: svg('<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 12.5 9 5 9-5"/>'),
  db: svg('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  tools: svg('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/>'),
  shield: svg('<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/>'),
  users: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3 3 0 0 1 0 6M18 14c2 .6 3 2.5 3 5"/>'),
  chat: svg('<path d="M4 5h16v11H9l-5 4V5z"/>'),
  refresh: svg('<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>')
};
const LABELS = ["", "Beginner", "Intermediate", "Advanced"];
const levelOf = it => {                       // 0 = no level (shown as a plain tag); only Beginner/Intermediate/Advanced count
  if (!it || typeof it !== "object" || !it.level) return 0;
  return Math.max(0, LABELS.findIndex(l => l && l.toLowerCase() === String(it.level).toLowerCase()));
};
const usedIn = n => DATA.projects.filter(p => (p.stack || []).some(x => x.toLowerCase() === n.toLowerCase())).map(p => p.name);
const tip = n => { const u = usedIn(n); return u.length ? "Used in: " + u.join(", ") : ""; };
const meter = lv => { const m = el("span", { className: "meter" }, [1, 2, 3].map(n => el("i", { className: n <= lv ? "on" : "" }))); return m; };

function skillCard(g) {
  const items = g.items.map(it => typeof it === "string" ? { name: it } : it);
  const leveled = items.filter(levelOf), plain = items.filter(it => !levelOf(it));
  const card = el("article", { className: "sk-card" });
  if (g.size) card.dataset.size = g.size;
  card.append(el("div", { className: "sk-head" }, [
    el("span", { className: "sk-ico", innerHTML: SKILL_ICONS[g.icon] || "" }),
    el("h3", { textContent: g.group })
  ]));
  if (g.note) card.append(el("p", { className: "sk-note", textContent: g.note }));
  if (g.kind === "lang") {                                           // same chip style as every other category
    card.append(el("div", { className: "sk-chips" }, items.map(it => el("span", { className: "sk" }, [it.name, ...(it.note ? [el("small", { textContent: "· " + it.note })] : [])]))));
    return card;
  }
  if (leveled.length) card.append(el("ul", { className: "sk-levels" }, leveled.map(it => {
    const lv = levelOf(it), m = meter(lv);
    m.setAttribute("role", "img"); m.setAttribute("aria-label", it.name + ": " + LABELS[lv] + " (" + lv + " of 3)");
    return el("li", { className: "sk-level", title: tip(it.name) }, [el("b", { textContent: it.name }), el("small", { textContent: LABELS[lv] }), m]);
  })));
  if (plain.length) card.append(el("div", { className: "sk-chips" }, plain.map(it => el("span", { className: "sk", textContent: it.name, title: tip(it.name) }))));
  return card;
}
DATA.skills.forEach(g => $("skillList").append(skillCard(g)));

if (DATA.skills.some(g => g.items.some(levelOf))) {                 // legend only when the owner has set levels
  $("skillLegend").replaceChildren("Proficiency:", ...[1, 2, 3].map(n => el("span", { className: "lg" }, [meter(n), LABELS[n]])));
  $("skillLegend").hidden = false;
}
if (DATA.learning && DATA.learning.length) {
  $("learning").replaceChildren(
    el("h3", {}, [el("span", { innerHTML: SKILL_ICONS.refresh }), "Currently learning"]),
    el("p", { textContent: "In progress, kept separate from the skills above." }),
    el("ul", {}, DATA.learning.map(l => { const it = typeof l === "string" ? { name: l } : l;
      return el("li", {}, [el("b", { textContent: it.name }), ...(it.note ? [el("span", { textContent: it.note })] : [])]); })));
  $("learning").hidden = false;
}

DATA.education.forEach(e => $("eduList").append(el("p", { className: "edu" }, [
  el("strong", { textContent: e.school }), el("br"), e.degree + " · " + e.period
])));

/* CV link */
if (DATA.cv) { $("cvBtn").href = DATA.cv; $("cvBtn").hidden = false; }

/* Status badge + stats */
if (DATA.status) { $("statusText").textContent = DATA.status; $("status").hidden = false; }
const skillCount = DATA.skills.filter(g => g.kind === "tech").reduce((n, g) => n + g.items.length, 0);
[[DATA.projects.length, "Projects"], [skillCount, "Skills"]].forEach(([n, l]) =>
  $("stats").append(el("div", { className: "stat" }, [el("b", { textContent: n }), el("span", { textContent: l })])));

/* Fade-in on scroll (skipped for reduced-motion users or old browsers) */
if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  document.querySelectorAll("main section").forEach(t => { t.classList.add("reveal"); io.observe(t); });
}
</script>
</body>
</html>
